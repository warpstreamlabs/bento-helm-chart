apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bento.fullname" . }}-test-connection"
  labels:
    {{- include "bento.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "kube-linter.io/ignore-all": "Linter does not need to run on this test"
spec:
  automountServiceAccountToken: false
  serviceAccountName: {{ include "bento.serviceAccountName" . }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      securityContext:
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      image: busybox
      command: ['wget']
      args: ['{{ include "bento.fullname" . }}:{{ .Values.service.port }}/ping']
  restartPolicy: Never
